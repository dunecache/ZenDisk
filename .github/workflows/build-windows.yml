name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      # Required to publish the packaged exe as a release asset.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is read from the "packageManager" field in package.json.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer (Vite)
        run: pnpm --filter @zendisk/desktop build

      - name: Download Neutralino binaries
        # `neu update` fetches the platform binaries into apps/desktop/bin.
        # The client library is intentionally skipped (bundled via npm).
        working-directory: apps/desktop
        run: pnpm exec neu update --latest

      - name: Package Neutralino app
        working-directory: apps/desktop
        run: pnpm exec neu build --release --clean

      - name: Verify Windows executable
        working-directory: apps/desktop
        shell: pwsh
        run: |
          if (-not (Test-Path "release/zendisk/zendisk-win_x64.exe")) {
            throw "Windows executable was not produced"
          }
          Get-ChildItem -Recurse release | Select-Object FullName, Length

      # Actions artifact storage is quota-limited on this account, so publish
      # the package as a rolling pre-release asset instead (separate storage).
      - name: Publish Windows build
        if: github.event_name != 'pull_request'
        working-directory: apps/desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "windows-latest"
          $zip = "release/zendisk-release.zip"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title "Windows build (latest)" --notes "Automated Windows build from main." $zip
          } else {
            gh release upload $tag $zip --clobber
          }
