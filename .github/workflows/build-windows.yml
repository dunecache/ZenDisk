name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded pushes should not race to publish to the same rolling release.
concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      # Required to publish the installer as a rolling pre-release asset.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # Version is read from the "packageManager" field in package.json.

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        working-directory: apps/desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $isPr = '${{ github.event_name }}' -eq 'pull_request'
          $version = if ($isPr) { "0.0.${{ github.run_number }}" } else { "0.1.${{ github.run_number }}" }
          @{
            version = $version
            bundle = @{ createUpdaterArtifacts = (-not $isPr) }
          } | ConvertTo-Json -Depth 5 | Set-Content tauri.ci.json
          # `--config` is deep-merged, so bundle.targets/icon are preserved.
          # PRs skip updater artifacts because signing secrets are unavailable.
          pnpm exec tauri build --config tauri.ci.json

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $setup = Get-ChildItem -Path $bundle -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer was not produced" }
          if ('${{ github.event_name }}' -ne 'pull_request' -and -not (Test-Path "$($setup.FullName).sig")) {
            throw "Updater signature was not produced"
          }
          Get-ChildItem -Recurse $bundle | Select-Object FullName, Length

      - name: Smoke test native commands
        shell: pwsh
        run: |
          $binary = "apps/desktop/src-tauri/target/release/zendisk.exe"
          if (-not (Test-Path $binary)) { throw "Native binary was not produced" }
          $out = Join-Path $env:RUNNER_TEMP "zendisk-smoke.json"
          $err = Join-Path $env:RUNNER_TEMP "zendisk-smoke.err"
          # windows_subsystem=windows makes this a GUI process; Start-Process
          # -Wait is required to observe its exit code and captured output.
          $proc = Start-Process -FilePath $binary -ArgumentList "--smoke" -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out
          Get-Content $err
          if ($proc.ExitCode -ne 0) { throw "Native smoke test failed with exit code $($proc.ExitCode)" }

      - name: Silent install, launch and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer was not produced" }
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $installDir = Join-Path $env:LOCALAPPDATA "ZenDisk"
          $app = Get-ChildItem $installDir -Filter "ZenDisk.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "Installed application was not found" }
          $launched = Start-Process -FilePath $app.FullName -ArgumentList "--smoke" -Wait -PassThru
          if ($launched.ExitCode -ne 0) { throw "Installed application smoke test failed" }
          $uninstaller = Get-ChildItem $installDir -Filter "unins*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { throw "Uninstaller was not found" }
          Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait

      - name: Generate update manifest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $setup = Get-ChildItem -Path $bundle -Filter "*-setup.exe" | Select-Object -First 1
          $version = (Get-Content apps/desktop/tauri.ci.json -Raw | ConvertFrom-Json).version
          $signature = (Get-Content "$($setup.FullName).sig" -Raw).Trim()
          $assetUrl = "https://github.com/${{ github.repository }}/releases/download/windows-latest/$($setup.Name)"
          @{
            version = $version
            notes = "Automated Windows build from ${{ github.sha }}"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $assetUrl
              }
            }
          } | ConvertTo-Json -Depth 10 | Set-Content latest.json -Encoding utf8
          Get-Content latest.json

      # Actions artifact storage is quota-limited on this account, so publish
      # the installer as a rolling pre-release asset instead.
      - name: Publish Windows build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "windows-latest"
          $bundle = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $setup = Get-ChildItem -Path $bundle -Filter "*-setup.exe" | Select-Object -First 1
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title "Windows build (latest)" --notes "Automated Windows build from main."
          }
          # Order matters: the manifest is uploaded last so clients never see
          # a signature pointing at an asset that is not yet uploaded.
          gh release upload $tag $setup.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload installer" }
          gh release upload $tag "$($setup.FullName).sig" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload signature" }
          gh release upload $tag latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload update manifest" }

          # Remove assets from previous builds; filenames are versioned, so
          # --clobber alone would leave stale installers in the release.
          $assets = gh release view $tag --json assets --jq '.assets[].name'
          foreach ($asset in $assets) {
            $isOldInstaller = $asset -like 'ZenDisk_*-setup.exe' -and $asset -ne $setup.Name
            $isOldSignature = $asset -like 'ZenDisk_*-setup.exe.sig' -and $asset -ne "$($setup.Name).sig"
            if ($isOldInstaller -or $isOldSignature -or $asset -eq 'zendisk-release.zip') {
              gh release delete-asset $tag $asset --yes
            }
          }
          exit 0
