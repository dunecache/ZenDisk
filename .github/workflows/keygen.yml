name: Generate updater signing key (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate password-protected keypair
        env:
          KEYGEN_PASSWORD: ${{ secrets.KEYGEN_PASSWORD }}
        run: |
          test -n "$KEYGEN_PASSWORD" || { echo "KEYGEN_PASSWORD secret is missing"; exit 1; }
          npx --yes @tauri-apps/cli@2.12.6 signer generate --ci \
            -w "$RUNNER_TEMP/zendisk.key" \
            -p "$KEYGEN_PASSWORD" \
            -f

      # Actions artifact storage is quota-limited on this account, so the
      # keypair is printed to this private run log and the run is deleted after
      # import. The password is never printed.
      - name: Print keypair
        run: |
          echo "ZENDISK_KEY_B64_BEGIN"
          base64 -w0 "$RUNNER_TEMP/zendisk.key"
          echo
          echo "ZENDISK_KEY_B64_END"
          echo "ZENDISK_PUB_B64_BEGIN"
          base64 -w0 "$RUNNER_TEMP/zendisk.key.pub"
          echo
          echo "ZENDISK_PUB_B64_END"
