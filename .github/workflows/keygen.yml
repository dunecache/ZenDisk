name: Generate updater signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keypair
        run: npx --yes @tauri-apps/cli@2.12.6 signer generate --ci -w "$RUNNER_TEMP/zendisk.key"

      - name: Print keypair
        run: |
          echo "PRIVATE_KEY_BEGIN"
          cat "$RUNNER_TEMP/zendisk.key"
          echo "PRIVATE_KEY_END"
          echo "PUBLIC_KEY_BEGIN"
          cat "$RUNNER_TEMP/zendisk.key.pub"
          echo "PUBLIC_KEY_END"
